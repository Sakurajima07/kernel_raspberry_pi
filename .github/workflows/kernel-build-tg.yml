name: Pi kernel build Telegram

on:
  pull_request:
    paths-ignore:
      - '.github/**'
    branches: [ "rpi-*" ]
  push:
    paths-ignore:
      - '.github/**'
    branches: [ "rpi-*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Telegram (build started)
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🚀 *Kernel build started!*\nRepository: *${{ github.repository }}*\nBranch: *${{ github.ref_name }}*\nCommit: `${{ github.sha }}`"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="$MSG"

      - name: Build kernel
        run: |
          mkdir -p out
          echo "Simulating kernel build..." > out/build.log
          sleep 5
          echo "Build complete!" >> out/build.log

          ARCH=$(uname -m)
          if [[ "$ARCH" == "aarch64" || "$ARCH" == "arm64" ]]; then
            echo "Packaging as ZIP for arm64..."
            zip -r kernel_build.zip ./out/
            echo "ARTIFACT_FILE=kernel_build.zip" >> $GITHUB_ENV
          else
            echo "Packaging as TAR for other architectures..."
            tar -czf kernel_build.tar.gz ./out/
            echo "ARTIFACT_FILE=kernel_build.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: kernel_build
          path: ${{ env.ARTIFACT_FILE }}

      - name: Send build result & file to Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          # Status message
          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
          elif [ "$STATUS" = "failure" ]; then
            EMOJI="❌"
          else
            EMOJI="⚠️"
          fi

          MSG="${EMOJI} *Kernel build finished!*\nRepository: *${{ github.repository }}*\nBranch: *${{ github.ref_name }}*\nStatus: *${STATUS}*"
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="$MSG"

          # Send file if it exists
          if [ -f "${{ env.ARTIFACT_FILE }}" ]; then
            curl -s -F chat_id="${CHAT_ID}" \
                 -F document=@"${{ env.ARTIFACT_FILE }}" \
                 "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          fi